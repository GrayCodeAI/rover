[package]
name = "rover-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
rover-core = { path = "../rover-core" }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std", "unbounded_depth"] }
serde_stacker = "=0.1.14"
stacker = "=0.1.25"
sha2 = "=0.11.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "std"] }

[lints]
workspace = true
