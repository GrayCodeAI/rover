name: source-validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.6'
          cache: false
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libsqlite3-dev python3
      - name: Validate Go toolchain
        run: make toolchain-check
      - name: Validate version surfaces
        run: make version-check
      - name: Validate source manifest
        run: make manifest-check
      - name: Format, vet, tests
        run: make check
      - name: Race detector
        run: make race
      - name: Short parser fuzz campaigns
        run: make fuzz
      - name: Real detached fixture workflow
        run: make demo
      - name: Extended terminal, workflow and protocol scenarios
        run: make demo-extended
      - name: Python CLI client
        run: make sdk-test
      - name: TypeScript CLI client
        run: node --test sdk/typescript/test/*.test.ts
      - name: Go CLI client
        run: go test ./sdk/go -count=1 -v
      - name: Cross-compile for all supported platforms
        run: make cross-build
      - name: Vulnerability scanning
        run: make vulncheck
# This validates Rover's own source. It is not an independently trusted Rover
# acceptance publisher for arbitrary candidate PRs. Hosted execution is pending.
