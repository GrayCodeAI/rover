name: source-validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The Go binary is the Rover product. Its gates run in their own job so a
  # Rust preview failure never hides Go results (and vice versa).
  go:
    name: go (linux/amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.6'
          cache: false
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libsqlite3-dev python3
      - name: Validate Go toolchain
        run: make toolchain-check
      - name: Validate version surfaces
        run: make version-check
      - name: Validate source manifest
        run: make manifest-check
      - name: Format, vet, tests
        run: make check
      - name: Race detector
        run: make race
      - name: Short parser fuzz campaigns
        run: make fuzz
      - name: Real detached fixture workflow
        run: make demo
      - name: Extended terminal, workflow and protocol scenarios
        run: make demo-extended
      - name: Cross-compile for all supported platforms
        run: make cross-build
      - name: Vulnerability scanning
        run: make vulncheck
  # Unreleased Rust port preview (crates/, gated by docs/design/RUST_PARITY_PLAN.md).
  rust:
    name: rust preview (linux/amd64, 1.88.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust MSRV toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy --component rustfmt
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # .cargo/config.toml sets target-dir = target/rust-1.88.0.
          workspaces: '. -> target/rust-1.88.0'
          # Only main writes the cache; branches and PRs restore from it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Fetch locked Rust dependencies
        run: cargo +1.88.0 fetch --locked
      - name: Format, lint, test, and audit Rust workspace
        run: make rust-check CARGO='cargo +1.88.0'
      - name: Generate Rust CycloneDX SBOM
        run: make rust-sbom CARGO='cargo +1.88.0'
# This validates Rover's own source on GitHub-hosted runners. It is not an
# independently trusted Rover acceptance publisher for arbitrary candidate PRs.
