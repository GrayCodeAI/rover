name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.2.0-alpha.2)'
        required: true
      draft:
        description: 'Create as draft release?'
        type: boolean
        default: true
permissions:
  contents: write
  id-token: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d2759364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 'stable'
          cache: false
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libsqlite3-dev python3
      - name: Set version
        run: |
          echo "ROVER_VERSION=${{ inputs.version }}" > "$GITHUB_ENV"
      - name: Build host binary (linux/amd64, CGO)
        run: make build
      - name: Cross-compile darwin/amd64 (cgo-free)
        run: GOFLAGS=-buildvcs=false CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -o bin/rover-darwin-amd64 ./cmd/rover
      - name: Cross-compile darwin/arm64 (cgo-free)
        run: GOFLAGS=-buildvcs=false CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o bin/rover-darwin-arm64 ./cmd/rover
      - name: Generate SBOM
        run: make sbom
      - name: Run govulncheck
        run: make vulncheck
      - name: Run checks
        run: |
          make check
          make race
      - name: Compute checksums
        run: |
          cd bin
          sha256sum rover rover-linux-amd64 rover-darwin-amd64 rover-darwin-arm64 rover-sbom.json > checksums.txt
      - name: Create release
        uses: softprops/action-gh-release@8f7ab71908ac24848f30f6066c520d5ddf38a571 # v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          draft: ${{ inputs.draft }}
          generate_release_notes: true
          files: |
            bin/rover
            bin/rover-linux-amd64
            bin/rover-darwin-amd64
            bin/rover-darwin-arm64
            bin/rover-sbom.json
            bin/checksums.txt
# This release workflow is opt-in (workflow_dispatch only). It does NOT run
# automatically on push or PR. Review the build artifacts and govulncheck
# results before publishing. Per project policy, no automatic credential upload,
# signing key injection, or deployment occurs.
