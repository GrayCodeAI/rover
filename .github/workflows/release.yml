name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.0.1)'
        required: true
      draft:
        description: 'Create as draft release?'
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.6'
          cache: false
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libsqlite3-dev python3
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            v*) version="${RELEASE_TAG#v}" ;;
            *) printf 'release tag must start with v\n' >&2; exit 1 ;;
          esac
          source_version="$(tr -d '\r\n' < VERSION)"
          if [ "$version" != "$source_version" ]; then
            printf 'release tag %s does not match VERSION %s\n' "$RELEASE_TAG" "$source_version" >&2
            exit 1
          fi
      - name: Validate Go toolchain
        run: make toolchain-check
      - name: Validate version surfaces
        run: make version-check
      - name: Validate source manifest
        run: make manifest-check
      - name: Build host binary (linux/amd64, CGO)
        run: make build
      - name: Verify source package
        run: ./bin/rover doctor --verify --json
      - name: Build declared target matrix
        run: make cross-build
      - name: Generate SBOM
        run: make sbom
      - name: Run govulncheck
        run: make vulncheck
      - name: Run checks
        run: |
          make check
          make race
      - name: Compute checksums
        run: |
          cd bin
          sha256sum rover rover-linux-amd64 rover-darwin-amd64 rover-darwin-arm64 rover-sbom.json > checksums.txt
      - name: Create release
        uses: softprops/action-gh-release@8f7ab71908ac24848f30f6066c520d5ddf38a571 # v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          draft: ${{ inputs.draft }}
          generate_release_notes: true
          files: |
            bin/rover
            bin/rover-linux-amd64
            bin/rover-darwin-amd64
            bin/rover-darwin-arm64
            bin/rover-sbom.json
            bin/checksums.txt
# This release workflow is opt-in (workflow_dispatch only). It does NOT run
# automatically on push or PR. Review the build artifacts and govulncheck
# results before publishing. Per project policy, no automatic credential upload,
# signing key injection, or deployment occurs.
